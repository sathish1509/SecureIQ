version: '3.8'

services:
  # Standalone Backend API & Scikit-Learn ML Model Service
  secureiq-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: secureiq-backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=*
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: Fullstack Unified Service (React SPA served by Flask)
  # Uncomment if running the integrated single-container deployment:
  # secureiq-fullstack:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: secureiq-fullstack
  #   ports:
  #     - "5000:5000"
  #   restart: unless-stopped
  #   environment:
  #     - PORT=5000
