{% extends "base.html" %}

{% block title %}SecureIQ | Account Login{% endblock %}

{% block content %}
<div class="page-container">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="brand-logo" style="display: inline-block; margin-bottom: 12px;">
                    <span class="logo-mark">SECURE</span><span class="logo-accent">IQ</span>
                </a>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to access your security analytics & dashboard</p>
            </div>

            <form action="/dashboard" method="GET" class="scan-form">
                <div class="form-group" style="margin-bottom: var(--space-4);">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="security@organization.com" required value="admin@secureiq.io">
                </div>

                <div class="form-group" style="margin-bottom: var(--space-4);">
                    <div class="form-row-flex">
                        <label for="password" class="form-label">Password</label>
                        <a href="/coming-soon" class="mono-text" style="color: var(--accent-blue); text-decoration: none;">Forgot password?</a>
                    </div>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••••••" required value="SecureIQ2026!">
                </div>

                <div class="form-row-flex" style="margin-bottom: var(--space-6);">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-secondary);">
                        <input type="checkbox" name="remember" checked style="accent-color: var(--accent-navy);">
                        Remember this device for 30 days
                    </label>
                </div>

                <button type="submit" class="btn-primary btn-lg" style="width: 100%;">Sign In to SecureIQ</button>
            </form>

            <div class="divider-line">Or continue with</div>

            <button type="button" class="btn-secondary btn-lg btn-google" onclick="window.location.href='/dashboard'">
                <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right: 8px;"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Continue with Google
            </button>

            <div style="text-align: center; font-size: 0.875rem; color: var(--text-muted); margin-top: var(--space-2);">
                Don't have an account? <a href="/coming-soon" style="color: var(--accent-blue); font-weight: 600; text-decoration: none;">Request Enterprise Trial</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
